<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Alexas Wordle</title>
  <style>
    :root{
      --bg:#0f1115; --fg:#e7ebf1; --muted:#b7c0d1; --tile:#1a1f2b; --tile-border:#2a3142;
      --green:#6aaa64; --yellow:#c9b458; --gray:#3a3f4f; --dark:#232a3a;
      --gap:.45rem; --size:3.1rem; --radius:.6rem;
    }
    @media (max-width:480px){ :root{ --size:3rem; --gap:.35rem; } }
    html,body{height:100%}
    body{margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display:flex; align-items:center; justify-content:center}
    .app{max-width:26rem; width:100%; padding:clamp(.5rem,2vw,1rem);}
    header{display:flex; align-items:center; justify-content:center; gap:.5rem;}
    header h1{font-weight:800; letter-spacing:.02em; margin:.2rem 0 1rem 0; text-align:center}

    /* Board */
    #board{ display:flex; flex-direction:column; align-items:center; gap:var(--gap); margin: 0 0 1rem 0; }
    .row{ display:grid; grid-template-columns: repeat(5, var(--size)); gap:var(--gap); }
    .tile{ display:flex; align-items:center; justify-content:center; font-weight:800; text-transform:uppercase; border:2px solid var(--tile-border); background:var(--tile); border-radius:var(--radius); font-size:1.3rem; }
    .tile.empty{ background:transparent; }

    /* Reveal states */
    .tile.correct{ background:var(--green); border-color:var(--green); color:white; }
    .tile.present{ background:var(--yellow); border-color:var(--yellow); color:white; }
    .tile.absent{ background:var(--gray); border-color:var(--gray); color:white; }

    /* Animations */
    .tile.bump{ animation: bump .12s ease-in-out; }
    @keyframes bump{ 0%{ transform:scale(1); } 50%{ transform:scale(1.08) } 100%{ transform:scale(1) } }

    .tile.reveal{ animation: flip .45s ease forwards; transform-style: preserve-3d; }
    @keyframes flip{ 0%{ transform: rotateX(0deg); } 50%{ transform: rotateX(90deg); } 100%{ transform: rotateX(0deg); } }

    .tile.fade{ animation: fade .35s ease; }
    @keyframes fade{ from{ opacity:.15 } to{ opacity:1 } }

    /* Keyboard */
    #kb{ display:flex; flex-direction:column; align-items:center; gap:.4rem; user-select:none; }
    .kb-row{ display:flex; justify-content:center; gap:.35rem; }
    button.key{ padding:.8rem .2rem; min-width:2.4rem; border:0; border-radius:.6rem; background:var(--dark); color:var(--fg); font-weight:700; text-transform:uppercase; letter-spacing:.02em; box-shadow: 0 1px 0 rgba(0,0,0,.4); }
    button.key:active{ filter:brightness(1.1) }
    button.key.small{ font-size:.9rem }
    .key.used{ background:#2b3244; color:var(--muted); }
    .key.absent{ background:var(--gray); color:white; }
    .key.present{ background:var(--yellow); color:white; }
    .key.correct{ background:var(--green); color:white; }

    /* win modal */
    .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; z-index:20; }
    .modal{ background:var(--tile); border-radius:1rem; padding:2rem 1.4rem; max-width:20rem; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.5); }
    .modal h2{ margin-top:0; color:var(--green); }
    .modal-overlay.show{ display:flex; animation: fade .4s ease; }

    /* win images */
    .win{ display:none; justify-content:space-between; align-items:center; margin-top:1rem; gap:1rem; }
    .win.show{ display:flex; }
    .win img{ width:48%; border-radius:1rem; box-shadow:0 10px 24px rgba(0,0,0,.35); }

    .pad{ padding-bottom: calc(env(safe-area-inset-bottom) + .5rem) }
  </style>
</head>
<body>
  <div class="app pad">
    <header>
      <h1>Alexas Wordle</h1>
    </header>

    <main>
      <div id="board" aria-live="polite"></div>

      <div id="kb" aria-label="Tastatur">
        <div class="kb-row" data-row="1"></div>
        <div class="kb-row" data-row="2"></div>
        <div class="kb-row" data-row="3"></div>
        <div class="kb-row" data-row="4"></div>
      </div>

      <div class="win" id="win">
        <img src="assets/törken-türken.png" alt="Gewonnen 1" />
        <img src="assets/3Gsq8_1751010233_8613.webp" alt="Gewonnen 2" />
        <audio id="win-audio" src="assets/win.mp3" preload="auto"></audio>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="win-modal">
    <div class="modal">
      <h2>Herzlichen Glückwunsch!</h2>
      <p>Alles gute zum Geburtstag Alexa!</p>
      <button id="close-modal" class="key small" style="margin-top:1rem">Schließen</button>
    </div>
  </div>

  <script type="module">
    const SECRET_WORD = "törke";
    const MAX_BASE_ROWS = 6;
    const WORD_LENGTH = 5;
    const REVEAL_DELAY = 420;

    const board = document.getElementById('board');
    const winBox = document.getElementById('win');
    const winAudio = document.getElementById('win-audio');
    const winModal = document.getElementById('win-modal');
    const closeModal = document.getElementById('close-modal');

    const rows = [
      'q w e r t z u i o p'.split(' '),
      'a s d f g h j k l'.split(' '),
      'y x c v b n m'.split(' '),
      ['send','ü','ö','ä','←']
    ];

    const kb = document.getElementById('kb');
    const kbRows = [...kb.querySelectorAll('.kb-row')];

    const keyButtons = new Map();
    rows.forEach((letters, rIdx) => {
      const rowEl = kbRows[rIdx];
      letters.forEach(letter => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'key';
        btn.dataset.key = letter;
        btn.textContent = letter;
        if (letter.length > 1) btn.classList.add('small');
        rowEl.appendChild(btn);
        if (/^[a-zäöüß]$/i.test(letter)) keyButtons.set(letter.toLowerCase(), btn);
      });
    });

    let currentRow = 0;
    let currentCol = 0;
    let finished = false;

    function makeRow(){
      const row = document.createElement('div');
      row.className = 'row';
      for (let i=0;i<WORD_LENGTH;i++){
        const tile = document.createElement('div');
        tile.className = 'tile empty';
        row.appendChild(tile);
      }
      board.appendChild(row);
      return row;
    }

    for (let i=0;i<MAX_BASE_ROWS;i++) makeRow();

    function isLetterKey(k){ return /^[a-zäöüß]$/i.test(k); }

    function addLetter(letter){
      if (finished) return;
      if (currentCol >= WORD_LENGTH) return;
      const row = board.children[currentRow];
      const tile = row.children[currentCol];
      tile.textContent = letter.toUpperCase();
      tile.classList.remove('empty');
      tile.classList.add('bump');
      setTimeout(() => tile.classList.remove('bump'), 130);
      currentCol++;
      const k = keyButtons.get(letter.toLowerCase());
      if (k && !k.classList.contains('correct') && !k.classList.contains('present') && !k.classList.contains('absent')){
        k.classList.add('used');
      }
    }

    function backspace(){
      if (finished) return;
      if (currentCol === 0) return;
      const row = board.children[currentRow];
      const tile = row.children[currentCol-1];
      tile.textContent = '';
      tile.classList.add('empty');
      currentCol--;
    }

    function getCurrentGuess(){
      const row = board.children[currentRow];
      return [...row.children].map(t => (t.textContent||'').toLowerCase()).join('');
    }

    function scoreGuess(guess, secret){
      const res = Array(WORD_LENGTH).fill('absent');
      const counts = {};
      for (const ch of secret){ counts[ch] = (counts[ch]||0)+1; }
      for (let i=0;i<WORD_LENGTH;i++){
        if (guess[i] === secret[i]){ res[i] = 'correct'; counts[guess[i]]--; }
      }
      for (let i=0;i<WORD_LENGTH;i++){
        if (res[i] === 'correct') continue;
        const ch = guess[i];
        if ((counts[ch]||0) > 0){ res[i] = 'present'; counts[ch]--; }
      }
      return res;
    }

    const rank = { absent:0, present:1, correct:2 };

    function updateKeyColor(letter, state){
      const btn = keyButtons.get(letter.toLowerCase());
      if (!btn) return;
      const current = btn.classList.contains('correct') ? 'correct' : btn.classList.contains('present') ? 'present' : btn.classList.contains('absent') ? 'absent' : null;
      if (!current || rank[state] > rank[current]){
        btn.classList.remove('used','absent','present','correct');
        btn.classList.add(state);
      }
    }

    async function revealRow(guess, scoring){
      const row = board.children[currentRow];
      for (let i=0;i<WORD_LENGTH;i++){
        const tile = row.children[i];
        tile.classList.add('reveal');
        await new Promise(r=>setTimeout(r, REVEAL_DELAY*0.55));
        tile.classList.remove('empty');
        tile.classList.add(scoring[i]);
        updateKeyColor(guess[i], scoring[i]);
        await new Promise(r=>setTimeout(r, REVEAL_DELAY*0.45));
        tile.classList.remove('reveal');
        tile.classList.add('fade');
        setTimeout(()=>tile.classList.remove('fade'), 350);
      }
    }

    function ensureNextRow(){
      if (currentRow >= board.children.length-1){
        makeRow();
      }
    }

    async function submit(){
      if (finished) return;
      if (currentCol < WORD_LENGTH) return;
      const guess = getCurrentGuess().toLowerCase();
      if (!/^[a-zäöüß]{5}$/i.test(guess)) return;

      const scoring = scoreGuess(guess, SECRET_WORD);
      await revealRow(guess, scoring);

      if (guess === SECRET_WORD){
        finished = true;
        showWin();
        try{ await winAudio.play(); }catch{}
        return;
      }

      currentRow++;
      currentCol = 0;
      ensureNextRow();
    }

    function showWin(){
      winBox.classList.add('show');
      winModal.classList.add('show');
    }

    kb.addEventListener('click', (e)=>{
      const btn = e.target.closest('button.key');
      if (!btn) return;
      const key = btn.dataset.key;
      if (!key) return;
      if (isLetterKey(key)) return addLetter(key);
      if (key === '←') return backspace();
      if (key === 'send') return submit();
    });

    window.addEventListener('keydown', (e)=>{
      if (finished) return;
      const k = e.key.toLowerCase();
      if (isLetterKey(k)) addLetter(k);
      else if (k === 'backspace') backspace();
      else if (k === 'enter') submit();
    });

    closeModal.addEventListener('click', ()=>{
      winModal.classList.remove('show');
    });
  </script>
</body>
</html>
